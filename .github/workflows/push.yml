name: Push

on:
  push:
    branches: [ "main" ]

jobs:
  test:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm test
  
  buildImage:

    needs: test

    runs-on: self-hosted

    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: benjamingodfrey/task-analysis-v2:latest,
          platforms: linux/amd64,linux/arm64,linux/arm/v7

  pushImage:

    needs: buildImage

    runs-on: self-hosted

    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            docker stop task-analysis-v2 || true
            docker rm task-analysis-v2 || true
            docker image rm --force benjamingodfrey/task-analysis-v2
            docker run -d --name task-analysis-v2 -e TELEGRAM_TOKEN='${{ secrets.TELEGRAM_TOKEN }}' -e TELEGRAM_TOKEN_TASK_RECIEVER='${{ secrets.TELEGRAM_TOKEN_TASK_RECIEVER }}' -e TELEGRAM_TOKEN_CLARIFICATION_REQUESTOR='${{ secrets.TELEGRAM_TOKEN_CLARIFICATION_REQUESTOR }}' -e TELEGRAM_TOKEN_FEEDBACK_BOT='${{ secrets.TELEGRAM_TOKEN_FEEDBACK_BOT }}' -e DB_CONNECTION_STRING='${{ secrets.DB_CONNECTION_STRING }}' -e OLLAMA_URL='${{ secrets.OLLAMA_URL }}' -e OLLAMA_MODEL='${{ secrets.OLLAMA_MODEL }}' -e OLLAMA_MODEL_SMALLER='${{ secrets.OLLAMA_MODEL_SMALLER }}' -e ENVIRONMENT='${{ secrets.ENVIRONMENT }}' benjamingodfrey/task-analysis-v2